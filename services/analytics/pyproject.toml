[project]
name = "tci-analytics"
version = "0.1.0"
description = "TCI ERP analytics service: credit rating and credit limit (FastAPI wrapper over credit_engine)."
requires-python = ">=3.12"
dependencies = [
    "credit-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
credit-engine = { path = "../../credit_engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
