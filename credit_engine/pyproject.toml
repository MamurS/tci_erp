[project]
name = "credit-engine"
version = "0.1.0"
description = "Credit rating, credit limit and financial analysis engine for TCI ERP (Mosaic Insurance Group). Pure domain library: no I/O, no DB, no HTTP."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
console_output_style = "count"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET"]

[tool.mypy]
strict = true
packages = ["credit_engine"]
mypy_path = "src"
