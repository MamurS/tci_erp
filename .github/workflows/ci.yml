name: CI

# Runs on every pull request and every push to main. Deliberately NO path
# filters: a required check that is skipped never reports, and branch
# protection then blocks the PR forever waiting for it.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run it interrupts; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (TCI_ERP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TCI_ERP
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TCI_ERP/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`: the root tsconfig is `"files": []` plus
      # project references, so --noEmit typechecks nothing and passes even on
      # a broken file. Build mode is what actually checks the app.
      - name: Typecheck (tsc -b)
        run: npm run typecheck

      # The remaining checks run even after an earlier failure, so one CI run
      # reports every problem instead of only the first.
      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests (vitest)
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build (vite)
        if: ${{ !cancelled() }}
        run: npm run build

  analytics:
    name: Analytics service (services/analytics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      # Needs the whole repo: services/analytics depends on ../../credit_engine
      # as an editable path dependency.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: pip install uv

      # The project is locked with uv (uv.lock), and credit-engine is a local
      # path dependency, so plain `pip install` cannot resolve it.
      - name: Cache uv downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py312-${{ hashFiles('services/analytics/uv.lock', 'credit_engine/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py312-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests (pytest)
        run: uv run pytest -q

  # The service is deployed as a container from Phase 3d on, so the image has
  # to build. Build only - nothing is pushed to a registry from CI.
  docker:
    name: Analytics image (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Context is the repo root on purpose: the service imports
      # credit_engine as an editable path dependency and cannot be built
      # from services/analytics alone.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: tci-analytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot answer /health is not a working deploy.
      - name: Smoke the image
        run: |
          docker run -d --name tci-analytics-ci -p 8000:8000 tci-analytics:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              echo "healthy after ${i}s"; cat /tmp/health.json; break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::the container never became healthy"
              docker logs tci-analytics-ci; exit 1
            fi
            sleep 1
          done
          # The engine endpoints must work with no configuration at all.
          curl -fsS http://127.0.0.1:8000/grade-scale | head -c 120; echo
          # And provisioning must report itself unconfigured rather than crash.
          curl -fsS http://127.0.0.1:8000/users/provisioning-status
          docker rm -f tci-analytics-ci
