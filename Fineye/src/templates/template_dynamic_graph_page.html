<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">

    <style media="screen">
        body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        size: A4;
        font-family: 'Arial', sans-serif;
        }

        @page {
            size: A4;
            margin: 0;
            width: 210mm;
            height: 297mm;
        }

        /* голубой блок */
        .outer-frame {
            background-color: #ffdcb2;
            height: 1402px;
            width: 100%;
            box-sizing: border-box;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .header {
            color: white;
            text-align: center;
            word-spacing: 10px;
            font-size: 36px;
            font-family: serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            width: 100%;
            padding-top: 24px;
            padding-bottom: 24px;
    /*      !!! Появляется пространство справа
            transform: scaelX(1.1); */
        }

        /*  синий блок  */
        .middle-frame {
            background-color: #3a7ca5;
            height: 1362px;
            width: 100%;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .inner-frame {
            background-color: white;
            height: 1252px;
            width: calc(100% - 41px);
            margin-left: 20px;
            margin-right: 20px;
            margin-bottom: 20px;
            padding-top: 26px;
            padding-bottom: 26px;
            padding-left: 25px;
            padding-right: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .info {
            font-size: 26px;
            text-transform: uppercase;
            margin: 0;
            padding: 10px;
        }

        .orange-line {
            background-color: orange;
            height: 2.5px;
            width: 100%;
        }

        .table {
            flex: 1;
        }

        .table-info {
            border-spacing: 6px;
            margin-bottom: 20px;
        }

        .table-rating {
            font-size: 5;
            margin-left: auto;
        }

        tr {
            line-height: 2;
        }

        td {
            white-space: pre-line;
            vertical-align: top;
            font-size: 16px;
        }

        .key {
            text-align: right;
            width: 310px;
            background-color: #e0ecf4;   /* #b1d7ee; */
            /* font-weight: bold; */
            text-transform: uppercase;
        }

        .key-standard {
            text-align: right;
            width: 310px;
            background-color: #b1d7ee;
        }

        .key-bold {
            text-align: right;
            width: 310px;
            background-color: #e0ecf4;
            font-weight: bold;
            text-transform: uppercase;
        }

        .key-white-background {
            background-color: white;
            font-weight: 400;
        }

        .value {
            text-align: left;
            padding-left: 20px;
        }

        .value-bold {
            text-align: left;
            padding-left: 20px;
            font-weight: bold;
        }

        .table-rating {
            width: 330px;
        }

        .table-rating thead {
            font-weight: bold;
            vertical-align: top;
            background-color: #fff4e4;
        }

        .table-rating tr:nth-child(even) {
            background-color: #fff4e4;
        }

        .table-rating tr {
            line-height: 1.3;
            text-indent: 7px;
        }

        #positiveDescription {
            color: #4e944e;
        }

        #negativeDescription {
            color: #fc110f;
        }

        /* .table div {
            border: 2px solid black;
            box-sizing: border-box;
            padding-top: 20px;
            padding-right: 20px;
            height: 290px;

        } */

        .footer {
            position: fixed;
            bottom: 0;
            text-align: center;
            width: 100%;
        }

        .footer p {
            text-align: right;
            padding-right: 120px;
            padding-bottom: 40px;
            font-weight: bold;
            color: #646464;
        }

        .formatted-number {
            unicode-bidi: bidi-override;
            direction: rtl;
        }


        .owners-main-companies-height-row {
            line-height: 1.2;
            height: 98px;
        }

        .address-height-row {
            height: 61px;
            line-height: 1.2;
        }
        
        .content {
            position: absolute;
            top: 247mm; /* 4.9 см = 49 мм */
            left: 0;
            width: 100%;
            padding-left: 60mm; /* стандартный отступ слева */
            padding-right: 160mm;
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <div class="outer-frame">

        <div class="middle-frame">

            <div class="header">{{ title }}</div>

            <div class="inner-frame">

                <p class="info">{{ subtitle }}</p>
                <div class="orange-line"></div>

                <div class="table">

                        <div>
                            <table class="table-rating">
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                </div>
                <!-- {{ legend_profitability }}
                <br>
                {{ legend_turnover }} -->
                <div class="footer">
                    <p>{{ page }} {{ page_number }}</p>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
